version: '3.8'

services:
  anonos-builder:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mounts the current directory to the container workspace
      - .:/workspace
    # Keeps the container running interactively
    tty: true
    stdin_open: true
    # Required if you plan to use advanced networking features inside QEMU host side
    privileged: true 
    environment:
      - MODE=build
